# arguments for dataset
dataset: AC
data_root: data/ACA
split_root: data/splits/aca
nclass: 18
crop_size: 322

# arguments for training
epochs: 80
batch_size: 8 # per GPU x 4 GPUs
lr: 0.000005
lr_multi: 40.0
criterion:
  name: CELoss
  kwargs:
    ignore_index: 255
conf_thresh: 0.95
style_prior_alpha: 0.6

# arguments for model
model: dpt
backbone: dinov2_small
lock_backbone: False
